# Copy to the distribution's Apache sites directory after replacing every
# example hostname, application path and certificate path. Keep only public/
# reachable; the PHP handler is supplied by the distribution's module or FPM.
<VirtualHost *:80>
    ServerName attendance.example.internal
    Redirect permanent / https://attendance.example.internal/
</VirtualHost>

<VirtualHost *:443>
    ServerName attendance.example.internal
    DocumentRoot /srv/shift-management/public

    SSLEngine on
    SSLCertificateFile /PATH/TO/CERTIFICATE_CHAIN.pem
    SSLCertificateKeyFile /PATH/TO/PRIVATE_KEY.pem

    # Do not let an accidental Alias expose application code or secrets.
    <Directory /srv/shift-management>
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /srv/shift-management/public>
        Options -Indexes -ExecCGI +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php

        # Match the full mapped path: a nested directory's index.php must
        # not become another executable entry point. Keep this path equal
        # to the configured DocumentRoot followed by /index.php.
        <FilesMatch "(?i)\.(php[0-9]*|phtml|phar|phps)$">
            Require expr "%{REQUEST_FILENAME} == '/srv/shift-management/public/index.php'"
        </FilesMatch>

        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
    </Directory>

    # Avatars are served by Laravel after authentication. They must stay
    # unreachable even if an operator accidentally creates a storage alias.
    <Directory /srv/shift-management/storage>
        AllowOverride None
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/shift-management-error.log
    CustomLog ${APACHE_LOG_DIR}/shift-management-access.log combined
</VirtualHost>
