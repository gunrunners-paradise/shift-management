<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>התחברות | מערכת נוכחות</title>
  <style>

html {
    overflow-y: scroll;
}
    :root {
      font-family: Arial, "Noto Sans Hebrew", sans-serif;
      color: #262c3b;
      background: #f4f6fb;
      --indigo: #453bcc;
      --blue: #4b81dc;
      --line: #dfe5ef;
      --shadow: 0 7px 23px #202c5a16;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    .topbar {
      background: linear-gradient(110deg, #3457be, #4636bf);
      min-height: 76px;
      box-shadow: var(--shadow);
    }
    .top-inner {
      max-width: 1400px;
      min-height: 76px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      padding: 10px 18px;
      color: white;
      font-size: 23px;
      font-weight: 800;
    }
    main {
      min-height: calc(100vh - 76px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 44px 16px 75px;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border-radius: 18px;
      padding: 34px;
      box-shadow: 0 12px 35px #202c5a1a;
      border: 1px solid #e8ebf3;
    }
    .logo {
      display: block;
      width: min(200px, 65%);
      height: auto;
      aspect-ratio: 1024 / 900;
      object-fit: contain;
      border-radius: 24px;
      margin: 0 auto 22px;
      box-shadow: 0 5px 18px #1d28751b;
      background: #fff;
    }
    h1 { font-size: 25px; text-align: center; margin: 0 0 8px; }
    .subtitle { font-size: 15px; color: #69758b; text-align: center; margin: 0 0 28px; line-height: 1.5; }
    .field { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-size: 15px; font-weight: 700; }
    input {
      display: block;
      width: 100%;
      height: 49px;
      padding: 0 15px;
      border: 1px solid #cfd7e4;
      border-radius: 11px;
      font: inherit;
      font-size: 16px;
      background: #fbfcff;
      color: #252b37;
    }
    input:focus { outline: 2px solid #547fe8; outline-offset: 1px; border-color: #547fe8; background: #fff; }
    .password-wrap { position: relative; }
    .password-wrap input { padding-left: 70px; }
    .toggle-password {
      position: absolute; left: 7px; top: 7px;
      height: 35px; padding: 0 9px;
      background: transparent; border: none; border-radius: 7px;
      color: #3e62af; font: inherit; font-size: 14px; cursor: pointer;
    }
    .toggle-password:hover { background: #eef2fd; }
    .submit {
      width: 100%;
      padding: 14px 18px;
      border: 0;
      border-radius: 12px;
      color: white;
      font-size: 19px;
      font-weight: 700;
      background: linear-gradient(110deg, #4563d8, #598ee1);
      box-shadow: 0 3px 9px #1d28752a;
      cursor: pointer;
      margin-top: 3px;
    }
    .submit:hover { filter: brightness(1.07); }
    .submit:focus-visible, .toggle-password:focus-visible { outline: 3px solid #303f9c; outline-offset: 3px; }
    .notice { padding: 12px; background: #eef2ff; color: #374c90; border: 1px solid #ccd8ff; border-radius: 10px; font-size: 14px; line-height: 1.5; margin: 17px 0 0; text-align: center; }
    .notice[hidden] { display: none; }
    @media (max-width: 700px) {
      .topbar, .top-inner { min-height: 68px; }
      .top-inner { padding: 9px 12px; font-size: 18px; }
      main { min-height: calc(100vh - 68px); padding: 24px 14px 48px; }
      .login-card { padding: 26px 22px; }
      .logo { width: min(170px, 60%); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="top-inner">מערכת נוכחות</div>
  </header>

  <main>
    <section class="login-card" aria-labelledby="login-heading">
      <!-- Keep this SVG in the same directory as this HTML file. -->
      <img class="logo" src="enter_digital_studio.svg" alt="Enter Digital Studio">
      <h1 id="login-heading">התחברות למערכת</h1>
      <p class="subtitle">הזינו את פרטי המשתמש שלכם כדי להמשיך</p>

      <form id="loginForm">
        <div class="field">
          <label for="username">שם משתמש</label>
          <input id="username" name="username" type="text" autocomplete="username" required placeholder="שם משתמש">
        </div>
        <div class="field">
          <label for="password">סיסמה</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="סיסמה">
            <button class="toggle-password" id="togglePassword" type="button" aria-label="הצגת סיסמה">הצג</button>
          </div>
        </div>
        <button class="submit" type="submit">התחברות</button>
      </form>
      <p class="notice" id="notice" role="status" hidden>זהו מסך הדגמה בלבד. ההתחברות תחובר לשרת Laravel בהמשך.</p>
    </section>
  </main>

  <script>
    const password = document.getElementById('password');
    const toggle = document.getElementById('togglePassword');

    toggle.addEventListener('click', () => {
      const visible = password.type === 'password';
      password.type = visible ? 'text' : 'password';
      toggle.textContent = visible ? 'הסתר' : 'הצג';
      toggle.setAttribute('aria-label', visible ? 'הסתרת סיסמה' : 'הצגת סיסמה');
    });

    document.getElementById('loginForm').addEventListener('submit', event => {
      event.preventDefault();
      document.getElementById('notice').hidden = false;
    });
  </script>
</body>
</html>
